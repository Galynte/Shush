name: Android SDK
description: Install Android SDK platform 37 and build-tools 37.0.0
runs:
  using: composite
  steps:
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: /home/runner/android-sdk
        key: android-sdk-37.0-build-tools-37.0.0-cmd15859902

    - name: Install Android SDK
      shell: bash
      run: |
        set -euo pipefail
        export ANDROID_HOME="${HOME}/android-sdk"
        echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
        echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
        if [ ! -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
          mv /tmp/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
        fi
        yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-37.0" \
          "build-tools;37.0.0" \
          "platform-tools"
